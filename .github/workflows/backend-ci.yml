name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v6
      - name: Check deployment scripts
        run: |
          /bin/bash -n deploy/apple-container.sh
          /bin/bash deploy/tests/apple-container-test.sh
          /bin/sh deploy/tests/docker-compose-security-test.sh
          /bin/sh deploy/tests/docker-compose-gateway-env-test.sh
          /bin/sh deploy/tests/docker-runtime-resources-test.sh
          /bin/sh deploy/test-caddyfile-cache.sh

  test:
    runs-on: ubuntu-latest
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v6
      - name: Check Docker Compose simple mode environment
        run: /bin/sh deploy/tests/docker-compose-simple-mode-env-test.sh
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.27.4'
      - name: Unit tests
        working-directory: backend
        run: make test-unit
      - name: Integration tests
        working-directory: backend
        run: make test-integration

  v0222-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: 'true'
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache-dependency-path: backend/go.sum
      - uses: docker/setup-buildx-action@v3
        id: v0222_builder
      - name: CI helper contract fixtures
        run: python3 -I -B tools/ci/v0222_test_helpers.py
      - name: Named-event SSE, retry and reader lifecycle race contracts, no skipped leaves
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../v0222-ci-evidence
          set +e
          python3 -I -B ../tools/ci/v0222_capture.py \
            --events ../v0222-ci-evidence/sse-race.jsonl --stderr ../v0222-ci-evidence/sse-race.stderr \
            --execution ../v0222-ci-evidence/sse-race-execution.json -- \
            go test -json -mod=readonly -p=2 -race -tags=unit ./internal/service \
            -run '^Test(V0222(SSEFastPath|GatewayRetry)|SSEStreamReaderLifecycle)' -count=1 -timeout=2m
          race_exit=$?
          set -e
          python3 ../tools/ci/v0222_test_receipt.py --mode sse \
            --events ../v0222-ci-evidence/sse-race.jsonl --exit-code "$race_exit" \
            --execution ../v0222-ci-evidence/sse-race-execution.json \
            --receipt ../v0222-ci-evidence/sse-race-receipt.json
          python3 -I -B ../tools/ci/v0222_test_receipt.py --mode retry \
            --events ../v0222-ci-evidence/sse-race.jsonl --exit-code "$race_exit" \
            --execution ../v0222-ci-evidence/sse-race-execution.json \
            --receipt ../v0222-ci-evidence/retry-race-receipt.json
          python3 -I -B ../tools/ci/v0222_test_receipt.py --mode sse-lifecycle \
            --events ../v0222-ci-evidence/sse-race.jsonl --stderr ../v0222-ci-evidence/sse-race.stderr \
            --exit-code "$race_exit" --execution ../v0222-ci-evidence/sse-race-execution.json \
            --receipt ../v0222-ci-evidence/sse-lifecycle-race-receipt.json
      - name: Isolated live-boundary race, exact outer cases and same-scenario evidence
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../v0222-ci-evidence
          set +e
          python3 -I -B ../tools/ci/v0222_capture.py \
            --events ../v0222-ci-evidence/live-boundary-race.jsonl --stderr ../v0222-ci-evidence/live-boundary-race.stderr \
            --execution ../v0222-ci-evidence/live-boundary-race-execution.json -- \
            go test -json -mod=readonly -p=2 -race -tags=unit ./internal/service \
            -run '^TestOpenAIInputTokensLiveBoundary$' -count=1 -timeout=180s
          race_exit=$?
          set -e
          python3 -I -B ../tools/ci/v0222_test_receipt.py --mode live-boundary \
            --events ../v0222-ci-evidence/live-boundary-race.jsonl --stderr ../v0222-ci-evidence/live-boundary-race.stderr \
            --exit-code "$race_exit" --execution ../v0222-ci-evidence/live-boundary-race-execution.json \
            --receipt ../v0222-ci-evidence/live-boundary-race-receipt.json
      - name: WS TTFT mode and admission origin race, exact three tops and seven leaves
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../v0222-ci-evidence
          set +e
          python3 -I -B ../tools/ci/v0222_capture.py \
            --events ../v0222-ci-evidence/ws-ttft-race.jsonl --stderr ../v0222-ci-evidence/ws-ttft-race.stderr \
            --execution ../v0222-ci-evidence/ws-ttft-race-execution.json -- \
            go test -json -mod=readonly -p=2 -race -tags=unit ./internal/service \
            -run '^(TestOpenAIWSPassthroughFirstTokenFollowsTTFTMode|TestOpenAIWSPassthroughTTFTOriginIncludesAdmission|TestOpenAIWSTTFTModeConn)$' -count=1 -timeout=180s
          race_exit=$?
          set -e
          python3 -I -B ../tools/ci/v0222_test_receipt.py --mode ws-ttft \
            --events ../v0222-ci-evidence/ws-ttft-race.jsonl --stderr ../v0222-ci-evidence/ws-ttft-race.stderr \
            --exit-code "$race_exit" --execution ../v0222-ci-evidence/ws-ttft-race-execution.json \
            --receipt ../v0222-ci-evidence/ws-ttft-race-receipt.json
      - name: Cache proof and accounting two-package race, fixed cases and no skips
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../v0222-ci-evidence
          set +e
          python3 -I -B ../tools/ci/v0222_capture.py \
            --events ../v0222-ci-evidence/cache-race.jsonl --stderr ../v0222-ci-evidence/cache-race.stderr \
            --execution ../v0222-ci-evidence/cache-race-execution.json -- \
            go test -json -mod=readonly -p=2 -race -tags=unit ./internal/service ./internal/pkg/apicompat \
            -run '^Test(V10Cache|V8OpenAICache)' -count=1 -timeout=180s
          race_exit=$?
          set -e
          python3 -I -B ../tools/ci/v0222_test_receipt.py --mode cache-race \
            --events ../v0222-ci-evidence/cache-race.jsonl --exit-code "$race_exit" \
            --execution ../v0222-ci-evidence/cache-race-execution.json \
            --receipt ../v0222-ci-evidence/cache-race-receipt.json
      - name: Same-request billing repository and lane integration race, no skipped leaves
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../v0222-ci-evidence
          set +e
          python3 -I -B ../tools/ci/v0222_capture.py \
            --events ../v0222-ci-evidence/billing-race.jsonl --stderr ../v0222-ci-evidence/billing-race.stderr \
            --execution ../v0222-ci-evidence/billing-race-execution.json -- \
            go test -json -mod=readonly -p=2 -race -tags=integration ./internal/repository \
            -run '^TestCompositeUsageV0222BillingSameRequestConcurrentApplyOnce$' -count=1 -timeout=5m
          race_exit=$?
          set -e
          python3 -I -B ../tools/ci/v0222_test_receipt.py --mode billing-race \
            --events ../v0222-ci-evidence/billing-race.jsonl --exit-code "$race_exit" \
            --execution ../v0222-ci-evidence/billing-race-execution.json \
            --receipt ../v0222-ci-evidence/billing-race-receipt.json
      - name: Genuine isolated PG guard-disable RED, default GREEN and integration race
        run: python3 -I -B tools/ci/v0222_rollup_red_green.py --artifacts v0222-ci-evidence
      - name: Exact d78 full app A-F, old/new cycles and genuine invalid-index recovery
        env:
          BUILDX_BUILDER: ${{ steps.v0222_builder.outputs.name }}
        run: python3 -I -B tools/ci/v0222_old_app_probe.py --artifacts v0222-ci-evidence --execute-isolated-ci-probe
      - name: Bind native migration compatibility evidence for release review
        run: python3 -I -B tools/ci/v0222_migration_evidence.py --artifacts v0222-ci-evidence
      - name: Upload compatibility evidence, including failed native attempts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v0222-ci-compatibility-evidence
          path: v0222-ci-evidence/
          if-no-files-found: error

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Frontend typecheck and critical vitest
        run: make test-frontend

  golangci-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.27.4'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          args: --timeout=30m --max-issues-per-linter=0 --max-same-issues=0
          working-directory: backend

  release-helpers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r .github/release-tools/requirements-release.txt
      - run: python -m unittest discover -s .github/release-tools -p 'test_release_matrix.py'
      - run: bash -n .github/release-tools/release-images.sh
