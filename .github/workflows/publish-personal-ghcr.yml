name: Publish Personal GHCR Image

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Image tag to publish
        required: true
        default: 0.2.7-compact-routing
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: personal-ghcr-publish
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/laoxiechuzheng/sub2api

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Resolve release metadata
        id: source
        shell: bash
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=${{ inputs.release_version }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push linux/amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.source.outputs.version }}
            ${{ env.IMAGE_NAME }}:latest
          build-args: |
            VERSION=${{ steps.source.outputs.version }}
            COMMIT=${{ steps.source.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/laoxiechuzheng/sub2api
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
            org.opencontainers.image.version=${{ steps.source.outputs.version }}

      - name: Verify pushed manifests
        run: |
          docker buildx imagetools inspect "${IMAGE_NAME}:${{ steps.source.outputs.version }}"
          docker buildx imagetools inspect "${IMAGE_NAME}:latest"
          echo "Published source SHA: ${{ steps.source.outputs.sha }}"
