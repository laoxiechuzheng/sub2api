name: Publish Personal GHCR Image

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Exact source commit or ref to build"
        required: true
        type: string
        default: "9e47eab6b76576ad6fb771fda046ded8c4109b68"
      image_tag:
        description: "Deployment tag (re-running may move it; pin production by digest)"
        required: true
        type: string
        default: "sha-9e47eab6b"

permissions:
  contents: read
  packages: write

concurrency:
  group: personal-ghcr-publish
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/laoxiechuzheng/sub2api
  RELEASE_VERSION: 0.1.182-local-codex-tools-20260825-r26
  GOLDEN_R18_VERSION: 0.1.179-local-codex-tools-20260823-r18
  GOLDEN_R18_DIGEST: sha256:e4c659bcc94488ac703f29b49854e06a974ca5d815666689df2562a3d9768226

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 1

      - name: Resolve exact source commit
        id: source
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push linux/amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ inputs.image_tag }}
            ${{ env.IMAGE_NAME }}:${{ env.RELEASE_VERSION }}
            ${{ env.IMAGE_NAME }}:latest
          build-args: |
            VERSION=${{ env.RELEASE_VERSION }}
            COMMIT=${{ steps.source.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
            org.opencontainers.image.version=${{ env.RELEASE_VERSION }}

      - name: Restore golden r18 version tag
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE_NAME}:${GOLDEN_R18_VERSION}" \
            "${IMAGE_NAME}@${GOLDEN_R18_DIGEST}"

      - name: Verify pushed manifest
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          docker buildx imagetools inspect "${IMAGE_NAME}:${{ inputs.image_tag }}"
          docker buildx imagetools inspect "${IMAGE_NAME}:${RELEASE_VERSION}"
          docker buildx imagetools inspect "${IMAGE_NAME}:${GOLDEN_R18_VERSION}"
          echo "Published source SHA: ${SOURCE_SHA}"
