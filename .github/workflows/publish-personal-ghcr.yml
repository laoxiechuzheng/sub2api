name: Publish Personal GHCR Image

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Image tag to publish
        required: true
        default: 0.2.22-custom-20261117
        type: string
  push:
    branches:
      - 'deploy/**'

permissions:
  contents: read
  packages: write

concurrency:
  group: personal-ghcr-publish
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/laoxiechuzheng/sub2api

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: CI helper contract fixtures
        run: python3 -I -B tools/ci/v0222_test_helpers.py
      - name: Backend unit regression tests
        working-directory: backend
        run: go test -mod=readonly -p 2 -tags=unit ./... -count=1 -timeout=10m
      - name: Race regression tests
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../v0222-publish-race-evidence
          set +e
          python3 -I -B ../tools/ci/v0222_capture.py \
            --events ../v0222-publish-race-evidence/race.jsonl --stderr ../v0222-publish-race-evidence/race.stderr \
            --execution ../v0222-publish-race-evidence/race-execution.json -- \
          go test -json -mod=readonly -p 2 -race -tags=unit \
          ./internal/requestdiagnostic ./internal/service ./internal/repository \
          ./internal/handler ./internal/handler/admin ./internal/server/middleware ./internal/server/routes \
          ./internal/config ./internal/pkg/httputil ./internal/pkg/adminaccess \
          ./internal/managementmcp ./internal/pkg/apicompat ./internal/server \
          -run 'Composite|NativeCompaction|DeepSeek|OpenRouter|CacheTTL|CacheControl|UpstreamProtocol|ResponsesChatFallback|ResponsesNativeGuard|Diagnostic|Diagnostics|Capture|AnthropicVisibleOutput|AnthropicCompat|ForwardAsCompat|GatewayForwardStreamDrain|CommentOnlySSEOverload|V0218|Gzip|Compressed|PartialUsage|ServerTiming|OpenAIUsage|OpenAICyber|RecordCyberPolicy|ScopedAdmin|ImageCount|MCP|MCPOAuth|ToolCatalog|ToolResult|BodyMemory|RequestBody|ReadTimeout|WriteTimeout|UpstreamDrain|HTTPUpstreamDrain|SSEQueue|SSETransport|BoundedSSE|AnthropicNativePump|AnthropicNativeLinePump|GatewayStreamingUndelimited|GatewayRequestBodyReuse|ThinkingBlocksNeedFiltering|FilterThinkingBlocks|OpenAIRequestPatches|OpenAICompatBufferedReasoning|StreamAccumulation|AccountTestService|AntigravityBuild|AnthropicMessagesURL|MessageStop|TailUsage|PartialCachedUsage|CyberSession|UsageRecordAsync|UsageRecordContext|CCBufferedFromNativeAnthropic|CCStreamingFromNativeAnthropic|ResponsesBufferedFromNativeAnthropic|ResponsesStreamingFromNativeAnthropic|V0222SSEFastPath|V0222GatewayRetry|V8OpenAI|UsageLogV0222Persistence|UsageBillingV0222Apply|V10Cache|SessionMemory|SSEStreamReaderLifecycle|OpenAIInputTokensLiveBoundary|OpenAIWSPassthroughFirstTokenFollowsTTFTMode|OpenAIWSPassthroughTTFTOriginIncludesAdmission|OpenAIWSTTFTModeConn' \
          -count=1 -timeout=10m
          race_exit=$?
          set -e
          python3 ../tools/ci/v0222_test_receipt.py --mode sse \
            --events ../v0222-publish-race-evidence/race.jsonl --exit-code "$race_exit" \
            --execution ../v0222-publish-race-evidence/race-execution.json \
            --receipt ../v0222-publish-race-evidence/race-receipt.json
          python3 -I -B ../tools/ci/v0222_test_receipt.py --mode retry \
            --events ../v0222-publish-race-evidence/race.jsonl --exit-code "$race_exit" \
            --execution ../v0222-publish-race-evidence/race-execution.json \
            --receipt ../v0222-publish-race-evidence/retry-race-receipt.json
          python3 -I -B ../tools/ci/v0222_test_receipt.py --mode session-memory \
            --events ../v0222-publish-race-evidence/race.jsonl --exit-code "$race_exit" \
            --execution ../v0222-publish-race-evidence/race-execution.json \
            --receipt ../v0222-publish-race-evidence/session-memory-race-receipt.json
          python3 -I -B ../tools/ci/v0222_test_receipt.py --mode sse-lifecycle \
            --events ../v0222-publish-race-evidence/race.jsonl --stderr ../v0222-publish-race-evidence/race.stderr \
            --exit-code "$race_exit" --execution ../v0222-publish-race-evidence/race-execution.json \
            --receipt ../v0222-publish-race-evidence/sse-lifecycle-race-receipt.json
      - name: Isolated live-boundary race, exact outer cases and same-scenario evidence
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../v0222-publish-race-evidence
          set +e
          python3 -I -B ../tools/ci/v0222_capture.py \
            --events ../v0222-publish-race-evidence/live-boundary-race.jsonl --stderr ../v0222-publish-race-evidence/live-boundary-race.stderr \
            --execution ../v0222-publish-race-evidence/live-boundary-race-execution.json -- \
            go test -json -mod=readonly -p=2 -race -tags=unit ./internal/service \
            -run '^TestOpenAIInputTokensLiveBoundary$' -count=1 -timeout=180s
          race_exit=$?
          set -e
          python3 -I -B ../tools/ci/v0222_test_receipt.py --mode live-boundary \
            --events ../v0222-publish-race-evidence/live-boundary-race.jsonl --stderr ../v0222-publish-race-evidence/live-boundary-race.stderr \
            --exit-code "$race_exit" --execution ../v0222-publish-race-evidence/live-boundary-race-execution.json \
            --receipt ../v0222-publish-race-evidence/live-boundary-race-receipt.json
      - name: WS TTFT mode and admission origin race, exact three tops and seven leaves
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../v0222-publish-race-evidence
          set +e
          python3 -I -B ../tools/ci/v0222_capture.py \
            --events ../v0222-publish-race-evidence/ws-ttft-race.jsonl --stderr ../v0222-publish-race-evidence/ws-ttft-race.stderr \
            --execution ../v0222-publish-race-evidence/ws-ttft-race-execution.json -- \
            go test -json -mod=readonly -p=2 -race -tags=unit ./internal/service \
            -run '^(TestOpenAIWSPassthroughFirstTokenFollowsTTFTMode|TestOpenAIWSPassthroughTTFTOriginIncludesAdmission|TestOpenAIWSTTFTModeConn)$' -count=1 -timeout=180s
          race_exit=$?
          set -e
          python3 -I -B ../tools/ci/v0222_test_receipt.py --mode ws-ttft \
            --events ../v0222-publish-race-evidence/ws-ttft-race.jsonl --stderr ../v0222-publish-race-evidence/ws-ttft-race.stderr \
            --exit-code "$race_exit" --execution ../v0222-publish-race-evidence/ws-ttft-race-execution.json \
            --receipt ../v0222-publish-race-evidence/ws-ttft-race-receipt.json
      - name: Cache proof and accounting two-package race, fixed cases and no skips
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../v0222-publish-race-evidence
          set +e
          python3 -I -B ../tools/ci/v0222_capture.py \
            --events ../v0222-publish-race-evidence/cache-race.jsonl --stderr ../v0222-publish-race-evidence/cache-race.stderr \
            --execution ../v0222-publish-race-evidence/cache-race-execution.json -- \
            go test -json -mod=readonly -p=2 -race -tags=unit ./internal/service ./internal/pkg/apicompat \
            -run '^Test(V10Cache|V8OpenAICache)' -count=1 -timeout=180s
          race_exit=$?
          set -e
          python3 -I -B ../tools/ci/v0222_test_receipt.py --mode cache-race \
            --events ../v0222-publish-race-evidence/cache-race.jsonl --exit-code "$race_exit" \
            --execution ../v0222-publish-race-evidence/cache-race-execution.json \
            --receipt ../v0222-publish-race-evidence/cache-race-receipt.json
      - name: Same-request billing repository and lane integration race, no skipped leaves
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../v0222-publish-race-evidence
          set +e
          python3 -I -B ../tools/ci/v0222_capture.py \
            --events ../v0222-publish-race-evidence/billing-race.jsonl --stderr ../v0222-publish-race-evidence/billing-race.stderr \
            --execution ../v0222-publish-race-evidence/billing-race-execution.json -- \
            go test -json -mod=readonly -p=2 -race -tags=integration ./internal/repository \
            -run '^TestCompositeUsageV0222BillingSameRequestConcurrentApplyOnce$' -count=1 -timeout=5m
          race_exit=$?
          set -e
          python3 -I -B ../tools/ci/v0222_test_receipt.py --mode billing-race \
            --events ../v0222-publish-race-evidence/billing-race.jsonl --exit-code "$race_exit" \
            --execution ../v0222-publish-race-evidence/billing-race-execution.json \
            --receipt ../v0222-publish-race-evidence/billing-race-receipt.json
      - name: Upload race contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v0222-publish-race-evidence
          path: v0222-publish-race-evidence/
          if-no-files-found: error
      - name: PostgreSQL diagnostic and precise routing integration tests
        working-directory: backend
        run: go test -v -mod=readonly -tags=integration ./internal/repository -run '^Test(RequestDiagnosticRepositoryIntegration|CompositeRoutePreciseConditions|Migration242DropsPlatformCheckConstraints|UserPlatformQuotaRepository_RejectsUnregisteredPlatform|CompositeModelRouteRepository_RejectsUnregisteredTargetPlatform)|^TestCompositeUsage|^TestCompositeRouteFallback|MCPOAuth' -count=1 -timeout=5m
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Frontend typecheck and full test suite
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm exec vue-tsc -b
          pnpm exec vitest run

  publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Resolve and validate release metadata
        id: source
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          version_file="$(tr -d '\r\n' < backend/cmd/server/VERSION)"
          version="$RELEASE_VERSION"
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            version="$version_file"
          fi
          if [[ ! "$version" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]; then
            echo "release_version must be a valid Docker tag" >&2
            exit 1
          fi
          if [[ "$version" != "$version_file" ]]; then
            echo "release_version '$version' does not match backend/cmd/server/VERSION '$version_file'" >&2
            exit 1
          fi
          {
            echo "sha=$(git rev-parse HEAD)"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare private runtime export and identity evidence paths
        shell: bash
        run: |
          set -euo pipefail
          work_dir="$(mktemp -d "${RUNNER_TEMP}/release-provenance.XXXXXX")"
          mkdir -p "${work_dir}/builder" "${work_dir}/runtime" \
            "${GITHUB_WORKSPACE}/release-provenance" "${GITHUB_WORKSPACE}/release-image-identity"
          {
            echo "PROVENANCE_WORK_DIR=${work_dir}"
            echo "PROVENANCE_DIR=${GITHUB_WORKSPACE}/release-provenance"
            echo "IDENTITY_DIR=${GITHUB_WORKSPACE}/release-image-identity"
          } >> "$GITHUB_ENV"

      - name: Build linux/amd64 image locally
        id: runtime_build
        uses: docker/build-push-action@v6
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          provenance: false
          sbom: false
          # 单一 Docker exporter：后续 docker load 使用这份已验证的原始 tar，而不是另一次导出。
          outputs: type=docker,dest=${{ env.PROVENANCE_WORK_DIR }}/runtime/image.tar,oci-mediatypes=true,compression=gzip
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.source.outputs.version }}
            ${{ env.IMAGE_NAME }}:latest
          build-args: |
            VERSION=${{ steps.source.outputs.version }}
            COMMIT=${{ steps.source.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/laoxiechuzheng/sub2api
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
            org.opencontainers.image.version=${{ steps.source.outputs.version }}

      - name: Verify BuildKit archive ownership and load the same runtime image
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.source.outputs.version }}
          BUILD_METADATA: ${{ steps.runtime_build.outputs.metadata }}
        run: |
          set -euo pipefail
          archive="${PROVENANCE_WORK_DIR}/runtime/image.tar"
          python3 -I -B tools/ci/v0222_oci_identity.py export --metadata-env BUILD_METADATA \
            --archive "$archive" --version-ref "${IMAGE_NAME}:${RELEASE_VERSION}" --latest-ref "${IMAGE_NAME}:latest" \
            --build-manifest "${PROVENANCE_WORK_DIR}/runtime/buildkit-manifest.json" \
            --receipt "${IDENTITY_DIR}/archive-identity.json"
          docker load --input "$archive"
          rm -- "$archive"

      - name: Export cached backend builder and final runtime files
        shell: bash
        env:
          BUILDX_BUILDER_NAME: ${{ steps.buildx.outputs.name }}
          RELEASE_VERSION: ${{ steps.source.outputs.version }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          work_dir="$PROVENANCE_WORK_DIR"
          builder_tag="sub2api-provenance-builder:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          version_ref="${IMAGE_NAME}:${RELEASE_VERSION}"

          docker buildx build \
            --builder "$BUILDX_BUILDER_NAME" \
            --file ./Dockerfile \
            --platform linux/amd64 \
            --target backend-builder \
            --build-arg "VERSION=${RELEASE_VERSION}" \
            --build-arg "COMMIT=${SOURCE_SHA}" \
            --tag "$builder_tag" \
            --load \
            .

          builder_container=""
          runtime_container=""
          cleanup() {
            for container in "$builder_container" "$runtime_container"; do
              if [[ -n "$container" ]]; then
                docker rm "$container" >/dev/null 2>&1 || true
              fi
            done
          }
          trap cleanup EXIT

          builder_container="$(docker create --network=none "$builder_tag")"
          runtime_container="$(docker create --network=none "$version_ref")"
          docker cp "${builder_container}:/app/sub2api" "${work_dir}/builder/sub2api"
          docker cp "${builder_container}:/app/backend/internal/web/dist" "${work_dir}/builder/dist"
          docker cp "${runtime_container}:/app/sub2api" "${work_dir}/runtime/sub2api"

          cleanup
          trap - EXIT

      - name: Verify binary provenance and runtime identity
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.source.outputs.version }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          EXPECTED_OCI_SOURCE: https://github.com/laoxiechuzheng/sub2api
          BUILD_METADATA: ${{ steps.runtime_build.outputs.metadata }}
        run: |
          set -euo pipefail
          version_ref="${IMAGE_NAME}:${RELEASE_VERSION}"
          builder_binary="${PROVENANCE_WORK_DIR}/builder/sub2api"
          runtime_binary="${PROVENANCE_WORK_DIR}/runtime/sub2api"
          if [[ ! -f "$builder_binary" || ! -f "$runtime_binary" ]]; then
            echo "builder or runtime binary was not exported" >&2
            exit 1
          fi

          builder_sha="$(sha256sum "$builder_binary" | awk '{print $1}')"
          runtime_sha="$(sha256sum "$runtime_binary" | awk '{print $1}')"
          if [[ "$builder_sha" != "$runtime_sha" ]]; then
            echo "cached builder binary SHA does not match final runtime image binary" >&2
            echo "builder: $builder_sha" >&2
            echo "runtime: $runtime_sha" >&2
            exit 1
          fi
          if ! cmp --silent "$builder_binary" "$runtime_binary"; then
            echo "cached builder binary differs from final runtime image binary" >&2
            exit 1
          fi

          version_output="$(docker run --rm --network none --entrypoint /app/sub2api "$version_ref" -version 2>&1)"
          printf '%s\n' "$version_output"
          version_regex="${RELEASE_VERSION//./\\.}"
          version_line_pattern="Sub2API[[:space:]]+${version_regex}[[:space:]]+\\(commit:[[:space:]]+${SOURCE_SHA},[[:space:]]+built:[[:space:]]+[^)]+\\)"
          version_matches="$(
            printf '%s\n' "$version_output" |
              grep -Eo "$version_line_pattern" |
              wc -l |
              tr -d '[:space:]' || true
          )"
          if [[ "$version_matches" != "1" ]]; then
            echo "runtime -version output must contain exactly one matching version/commit line" >&2
            exit 1
          fi

          actual_source="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.source" }}' "$version_ref")"
          actual_revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$version_ref")"
          actual_version="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$version_ref")"
          actual_platform="$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$version_ref")"
          runtime_image_id="$(docker image inspect --format '{{.Id}}' "$version_ref")"
          latest_image_id="$(docker image inspect --format '{{.Id}}' "${IMAGE_NAME}:latest")"

          [[ "$actual_source" == "$EXPECTED_OCI_SOURCE" ]] || {
            echo "runtime OCI source mismatch: $actual_source" >&2
            exit 1
          }
          [[ "$actual_revision" == "$SOURCE_SHA" ]] || {
            echo "runtime OCI revision mismatch: $actual_revision" >&2
            exit 1
          }
          [[ "$actual_version" == "$RELEASE_VERSION" ]] || {
            echo "runtime OCI version mismatch: $actual_version" >&2
            exit 1
          }
          [[ "$actual_platform" == "linux/amd64" ]] || {
            echo "runtime platform mismatch: $actual_platform" >&2
            exit 1
          }
          [[ "$runtime_image_id" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "invalid local OCI image ID: $runtime_image_id" >&2
            exit 1
          }
          [[ "$runtime_image_id" == "$latest_image_id" ]] || {
            echo "version and latest tags do not reference the same local image" >&2
            exit 1
          }

          canonical_config_digest="$(python3 -I -B tools/ci/v0222_oci_identity.py local \
            --metadata-env BUILD_METADATA --local-id "$runtime_image_id" --latest-id "$latest_image_id" \
            --platform "$actual_platform" --source "$actual_source" \
            --revision "$actual_revision" --version "$actual_version" \
            --expected-source "$EXPECTED_OCI_SOURCE" --expected-revision "$SOURCE_SHA" \
            --expected-version "$RELEASE_VERSION" --binary-sha256 "$runtime_sha" \
            --build-manifest "${PROVENANCE_WORK_DIR}/runtime/buildkit-manifest.json" \
            --receipt "${IDENTITY_DIR}/build-identity.json")"
          {
            echo "BINARY_SHA256=${runtime_sha}"
            # Historical artifact field means canonical config C, never Docker store-dependent .Id.
            echo "OCI_LOCAL_IMAGE_ID=${canonical_config_digest}"
            echo "OCI_DOCKER_LOCAL_IMAGE_ID=${runtime_image_id}"
          } >> "$GITHUB_ENV"
          echo "Verified builder/runtime binary SHA: ${runtime_sha}"
          echo "Verified local OCI continuity ID: ${runtime_image_id}"
          echo "Verified BuildKit canonical config: ${canonical_config_digest}"

      - name: Generate and validate asset manifest
        shell: bash
        run: |
          set -euo pipefail
          dist_dir="${PROVENANCE_WORK_DIR}/builder/dist"
          asset_manifest="${PROVENANCE_DIR}/asset-manifest.json"
          asset_count="$(
            python3 - "$dist_dir" "$asset_manifest" <<'PY'
          import hashlib
          import json
          import os
          import re
          import sys
          from pathlib import Path

          source = Path(sys.argv[1])
          output = Path(sys.argv[2])
          assets_dir = source / "assets"
          max_assets = 512
          max_asset_size = 64 * 1024 * 1024
          max_total_size = 64 * 1024 * 1024

          if assets_dir.is_symlink() or not assets_dir.is_dir():
              raise SystemExit(f"expected flat assets directory at {assets_dir}")

          with os.scandir(assets_dir) as iterator:
              entries = sorted(iterator, key=lambda entry: entry.name)

          if not entries:
              raise SystemExit("asset directory is empty")
          if len(entries) > max_assets:
              raise SystemExit(f"asset count exceeds limit: {len(entries)} > {max_assets}")

          files = []
          total_size = 0
          for entry in entries:
              if entry.is_symlink():
                  raise SystemExit(f"asset symlink is not allowed: {entry.path}")
              if entry.is_dir(follow_symlinks=False):
                  raise SystemExit(f"nested asset directory is not allowed: {entry.path}")
              if not entry.is_file(follow_symlinks=False):
                  raise SystemExit(f"asset is not a regular file: {entry.path}")
              if re.fullmatch(r"[A-Za-z0-9._-]+", entry.name) is None:
                  raise SystemExit(f"unsafe asset file name: {entry.name!r}")

              size = entry.stat(follow_symlinks=False).st_size
              if size > max_asset_size:
                  raise SystemExit(f"asset exceeds size limit: {entry.path} ({size} bytes)")
              total_size += size
              if total_size > max_total_size:
                  raise SystemExit(f"total asset size exceeds limit: {total_size} > {max_total_size}")

              digest = hashlib.sha256()
              with open(entry.path, "rb") as source_file:
                  for chunk in iter(lambda: source_file.read(1024 * 1024), b""):
                      digest.update(chunk)

              files.append(
                  {
                      "path": f"/assets/{entry.name}",
                      "sha256": digest.hexdigest(),
                      "size": size,
                  }
              )

          output.parent.mkdir(parents=True, exist_ok=True)
          with output.open("w", encoding="utf-8", newline="\n") as manifest_file:
              json.dump({"files": files}, manifest_file, ensure_ascii=True, separators=(",", ":"))
              manifest_file.write("\n")

          print(len(files))
          PY
          )"
          if [[ ! "$asset_count" =~ ^[1-9][0-9]*$ ]]; then
            echo "invalid asset count: $asset_count" >&2
            exit 1
          fi
          jq -e '
            (.files | type == "array") and
            ((.files | length) > 0) and
            ((.files | length) <= 512) and
            (([.files[].size] | add // 0) <= 67108864) and
            all(.files[];
              (.path | type == "string" and test("^/assets/[A-Za-z0-9._-]+$")) and
              (.sha256 | type == "string" and test("^[0-9a-f]{64}$")) and
              (.size | type == "number" and floor == . and . >= 0)
            )
          ' "$asset_manifest" >/dev/null
          asset_manifest_sha256="$(sha256sum "$asset_manifest" | awk '{print $1}')"
          {
            echo "ASSET_COUNT=${asset_count}"
            echo "ASSET_MANIFEST_SHA256=${asset_manifest_sha256}"
          } >> "$GITHUB_ENV"
          echo "Asset manifest SHA: ${asset_manifest_sha256} (${asset_count} files)"

      - name: Push verified image tags
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.source.outputs.version }}
        run: |
          set -euo pipefail
          docker push "${IMAGE_NAME}:${RELEASE_VERSION}"
          docker push "${IMAGE_NAME}:latest"

      - name: Resolve registry digest and write release manifest
        shell: bash
        env:
          BUILD_METADATA: ${{ steps.runtime_build.outputs.metadata }}
          BUILDX_BUILDER_NAME: ${{ steps.buildx.outputs.name }}
          RELEASE_VERSION: ${{ steps.source.outputs.version }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          version_ref="${IMAGE_NAME}:${RELEASE_VERSION}"
          latest_ref="${IMAGE_NAME}:latest"
          current_image_id="$(docker image inspect --format '{{.Id}}' "$version_ref")"
          current_latest_image_id="$(docker image inspect --format '{{.Id}}' "$latest_ref")"
          [[ "$current_image_id" == "$OCI_DOCKER_LOCAL_IMAGE_ID" ]] || {
            echo "local image ID changed after push: $current_image_id" >&2
            exit 1
          }
          [[ "$current_latest_image_id" == "$OCI_DOCKER_LOCAL_IMAGE_ID" ]] || {
            echo "local latest image ID changed after push: $current_latest_image_id" >&2
            exit 1
          }

          after_push_dir="${PROVENANCE_WORK_DIR}/runtime/after-push"
          mkdir -p "$after_push_dir"
          runtime_container=""
          cleanup() {
            if [[ -n "$runtime_container" ]]; then
              docker rm "$runtime_container" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT
          runtime_container="$(docker create --network=none "$version_ref")"
          docker cp "${runtime_container}:/app/sub2api" "${after_push_dir}/sub2api"
          cleanup
          trap - EXIT

          after_push_sha="$(sha256sum "${after_push_dir}/sub2api" | awk '{print $1}')"
          [[ "$after_push_sha" == "$BINARY_SHA256" ]] || {
            echo "local runtime binary SHA changed after push: $after_push_sha" >&2
            exit 1
          }
          if ! cmp --silent "${PROVENANCE_WORK_DIR}/runtime/sub2api" "${after_push_dir}/sub2api"; then
            echo "local runtime binary changed after push" >&2
            exit 1
          fi

          # --format 会加载配置；这里只取原始 manifest，并校验两个 tag 和 digest 引用的字节一致。
          version_raw="${PROVENANCE_WORK_DIR}/runtime/registry-version.json"
          latest_raw="${PROVENANCE_WORK_DIR}/runtime/registry-latest.json"
          pinned_raw="${PROVENANCE_WORK_DIR}/runtime/registry-pinned.json"
          docker buildx imagetools inspect --builder "$BUILDX_BUILDER_NAME" --raw "$version_ref" > "$version_raw"
          docker buildx imagetools inspect --builder "$BUILDX_BUILDER_NAME" --raw "$latest_ref" > "$latest_raw"
          version_digest="sha256:$(sha256sum "$version_raw" | awk '{print $1}')"
          docker buildx imagetools inspect --builder "$BUILDX_BUILDER_NAME" --raw \
            "${IMAGE_NAME}@${version_digest}" > "$pinned_raw"
          python3 -I -B tools/ci/v0222_oci_identity.py registry --metadata-env BUILD_METADATA \
            --manifest "$pinned_raw" --version-manifest "$version_raw" --latest-manifest "$latest_raw" \
            --expected-digest "$version_digest" \
            --expected-source https://github.com/laoxiechuzheng/sub2api \
            --expected-revision "$SOURCE_SHA" --expected-version "$RELEASE_VERSION" \
            --local-id "$current_image_id" --latest-id "$current_latest_image_id" \
            --binary-sha256 "$after_push_sha" \
            --asset-manifest "${PROVENANCE_DIR}/asset-manifest.json" \
            --asset-manifest-sha256 "$ASSET_MANIFEST_SHA256" --asset-count "$ASSET_COUNT" \
            --asset-directory "${PROVENANCE_WORK_DIR}/builder/dist" \
            --build-manifest "${PROVENANCE_WORK_DIR}/runtime/buildkit-manifest.json" \
            --build-receipt "${IDENTITY_DIR}/build-identity.json" \
            --receipt "${IDENTITY_DIR}/image-identity.json"
          cp "$pinned_raw" "${IDENTITY_DIR}/registry-manifest.json"

          release_manifest="${PROVENANCE_DIR}/release-manifest.json"
          jq -n \
            --arg source_commit "$SOURCE_SHA" \
            --arg version "$RELEASE_VERSION" \
            --arg ghcr_digest "$version_digest" \
            --arg binary_sha256 "$BINARY_SHA256" \
            --arg oci_local_image_id "$OCI_LOCAL_IMAGE_ID" \
            --arg asset_manifest_sha256 "$ASSET_MANIFEST_SHA256" \
            --argjson asset_count "$ASSET_COUNT" \
            '{
              source_commit: $source_commit,
              version: $version,
              ghcr_digest: $ghcr_digest,
              binary_sha256: $binary_sha256,
              oci_local_image_id: $oci_local_image_id,
              asset_manifest_sha256: $asset_manifest_sha256,
              asset_count: $asset_count
            }' > "$release_manifest"
          jq -e \
            --arg source_commit "$SOURCE_SHA" \
            --arg version "$RELEASE_VERSION" \
            --arg ghcr_digest "$version_digest" \
            --arg binary_sha256 "$BINARY_SHA256" \
            --arg oci_local_image_id "$OCI_LOCAL_IMAGE_ID" \
            --arg asset_manifest_sha256 "$ASSET_MANIFEST_SHA256" \
            --argjson asset_count "$ASSET_COUNT" \
            '.source_commit == $source_commit and
             .version == $version and
             .ghcr_digest == $ghcr_digest and
             .binary_sha256 == $binary_sha256 and
             .oci_local_image_id == $oci_local_image_id and
             .asset_manifest_sha256 == $asset_manifest_sha256 and
             .asset_count == $asset_count' \
            "$release_manifest" >/dev/null

          echo "Published source SHA: ${SOURCE_SHA}"
          echo "Published image: ${version_ref}@${version_digest}"

      - name: Upload release provenance
        uses: actions/upload-artifact@v4
        with:
          name: release-provenance
          path: |
            release-provenance/release-manifest.json
            release-provenance/asset-manifest.json
          if-no-files-found: error
      - name: Upload independent image identity proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-image-identity
          path: release-image-identity/
          if-no-files-found: error
